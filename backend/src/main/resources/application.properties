spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/ems
spring.datasource.username=root
spring.datasource.password=12344321

spring.jpa.hibernate.ddl-auto=update 
# it tells Hibernate to automatically create or update the database schema based on the entity classes.
# The value "update" means that Hibernate will update the schema without dropping existing tables.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# it specifies the SQL dialect that Hibernate should use when generating SQL statements for the database. 
# In this case, it is set to MySQLDialect, which is appropriate for a MySQL database.

